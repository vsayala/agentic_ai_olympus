bundle:
  name: olympus-adb
  databricks_cli_version: ">=1.3.0"
  engine: direct

include:
  - resources/*.yml

artifacts:
  default:
    type: whl
    build: uv build
    path: .

sync:
  include:
    - configs/**
    - scenarios/**
    - src/**

variables:
  catalog:
    description: Existing governed Unity Catalog catalog.
    default: data
  source_schema:
    description: Required lowercase schema dedicated to one approved source.

targets:
  dev:
    mode: development
    default: true
  qe:
    mode: production
  stg:
    mode: production
  prod:
    mode: production
