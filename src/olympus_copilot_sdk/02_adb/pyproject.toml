[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "olympus-adb"
version = "0.1.0"
description = "Typed Databricks retrieval adapters for Olympus."
requires-python = ">=3.11,<3.14"
dependencies = []

[project.optional-dependencies]
dev = [
  "bandit>=1.8,<2",
  "pip-audit>=2.9,<3",
  "pyright>=1.1.396,<2",
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/olympus_adb"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=src --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src"]