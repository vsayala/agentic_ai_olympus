targets:
  dev:
    default: true
    mode: development
    workspace:
      host: https://REPLACE_ME-dev.azuredatabricks.net
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
  qe:
    mode: production
    workspace:
      host: https://REPLACE_ME-qe.azuredatabricks.net
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.run_as_service_principal}
  stg:
    mode: production
    workspace:
      host: https://REPLACE_ME-stg.azuredatabricks.net
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.run_as_service_principal}
  prod:
    mode: production
    workspace:
      host: https://REPLACE_ME-prod.azuredatabricks.net
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.run_as_service_principal}
    presets:
      name_prefix: "prod_"
      tags:
        environment: prod
        managed_by: databricks-bundle