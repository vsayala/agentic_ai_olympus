# Move this file to resources/sharepoint_index.yml after semantic_chunks exists.
resources:
  vector_search_indexes:
    sharepoint:
      name: ${var.catalog}.sharepoint.semantic_index
      endpoint_name: ${resources.vector_search_endpoints.olympus_search.name}
      primary_key: chunk_id
      index_type: DELTA_SYNC
      index_subtype: HYBRID
      delta_sync_index_spec:
        source_table: ${var.catalog}.sharepoint.semantic_chunks
        pipeline_type: TRIGGERED
        embedding_source_columns:
          - name: chunk_to_embed
            embedding_model_endpoint_name: databricks-qwen3-embedding-0-6b
        columns_to_sync:
          - chunk_to_retrieve
          - source_uri
          - pages
          - modified_at
      grants:
        - principal: ${var.run_as_service_principal}
          privileges: [SELECT]