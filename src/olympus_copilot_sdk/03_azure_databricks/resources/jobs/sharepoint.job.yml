resources:
  jobs:
    sharepoint_pipeline:
      name: ${bundle.target}-sharepoint-semantic-pipeline
      description: Incrementally land SharePoint files, parse documents, and refresh AI Search.
      max_concurrent_runs: 1
      timeout_seconds: 14400
      queue:
        enabled: true
      schedule:
        quartz_cron_expression: "0 0 2 * * ?"
        timezone_id: UTC
        pause_status: PAUSED
      tasks:
        - task_key: validate_connection
          notebook_task:
            notebook_path: ../../notebooks/01_sharepoint/01_validate_connection.py
            base_parameters:
              connection: ${var.sharepoint_connection}
          environment_key: serverless_ai
        - task_key: land_files
          depends_on:
            - task_key: validate_connection
          notebook_task:
            notebook_path: ../../notebooks/01_sharepoint/02_land_files.py
            base_parameters:
              config_path: ${workspace.file_path}/configs/sharepoint.yml
              connection: ${var.sharepoint_connection}
              source_url: ${var.sharepoint_source_url}
          environment_key: serverless_ai
          max_retries: 2
          min_retry_interval_millis: 60000
        - task_key: parse_documents
          depends_on:
            - task_key: land_files
          notebook_task:
            notebook_path: ../../notebooks/01_sharepoint/03_parse_documents.py
            base_parameters:
              config_path: ${workspace.file_path}/configs/sharepoint.yml
              connection: ${var.sharepoint_connection}
              source_url: ${var.sharepoint_source_url}
          environment_key: serverless_ai
        - task_key: chunk_documents
          depends_on:
            - task_key: parse_documents
          notebook_task:
            notebook_path: ../../notebooks/01_sharepoint/04_chunk_documents.py
            base_parameters:
              config_path: ${workspace.file_path}/configs/sharepoint.yml
          environment_key: serverless_ai
        - task_key: sync_ai_search
          depends_on:
            - task_key: chunk_documents
          notebook_task:
            notebook_path: ../../notebooks/01_sharepoint/05_sync_ai_search.py
            base_parameters:
              config_path: ${workspace.file_path}/configs/sharepoint.yml
              connection: ${var.sharepoint_connection}
              source_url: ${var.sharepoint_source_url}
              search_endpoint: ${resources.vector_search_endpoints.olympus_search.name}
          environment_key: serverless_ai
        - task_key: validate_serving
          depends_on:
            - task_key: sync_ai_search
          notebook_task:
            notebook_path: ../../notebooks/01_sharepoint/06_validate_serving.py
            base_parameters:
              serving_endpoint: ${var.sharepoint_serving_endpoint}
          environment_key: serverless_ai
      environments:
        - environment_key: serverless_ai
          spec:
            environment_version: "3"
            dependencies:
              - ../../dist/*.whl
      tags:
        source: sharepoint
        layer: semantic