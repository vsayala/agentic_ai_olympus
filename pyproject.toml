[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "olympus-copilot-sdk"
version = "0.1.0"
description = "Governed Azure AI Foundry, Microsoft 365, SharePoint, and Databricks agent contracts."
requires-python = ">=3.11,<3.14"

dependencies = []

[project.optional-dependencies]
dev = [
	"bandit[toml]>=1.8,<2",
	"pip-audit>=2.8,<3",
	"pre-commit>=4.1,<5",
	"pyright>=1.1.396,<2",
	"pytest>=9.0.3,<10",
	"pytest-cov>=6.0,<8",
	"ruff>=0.9,<1",
]

[tool.hatch.build]
exclude = [
	"/src/olympus_copilot_sdk/01_sp/**",
	"/src/olympus_copilot_sdk/02_adb/**",
]

[tool.hatch.build.targets.sdist]
exclude = [
	"/src/olympus_copilot_sdk/01_sp/**",
	"/src/olympus_copilot_sdk/02_adb/**",
]

[tool.hatch.build.targets.wheel]
packages = ["src/olympus_copilot_sdk"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["src", "tests"]
exclude = [
	"src/olympus_copilot_sdk/01_sp",
	"src/olympus_copilot_sdk/02_adb",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=src --cov-report=term-missing"
testpaths = ["tests"]

[tool.bandit]
recursive = true
targets = ["src"]
exclude_dirs = [
	"src/olympus_copilot_sdk/01_sp",
	"src/olympus_copilot_sdk/02_adb",
]

[tool.coverage.run]
branch = true
source = ["src"]

# Use a lockfile in CI (for example, `uv lock`) and run `uv run pip-audit`.
[tool.uv]
default-groups = []
required-version = ">=0.6"