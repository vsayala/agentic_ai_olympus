[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "olympus-copilot-sdk"
version = "0.1.0"
description = "Secure agentic AI integrations for GitHub Copilot, Microsoft 365, Azure AI Foundry, and Databricks."
requires-python = ">=3.11,<3.14"

dependencies = [
	"github-copilot-sdk==1.0.8",
	"streamlit>=1.47,<2",
	"beautifulsoup4>=4.13,<5",
	"lxml>=5,<7",
	"openpyxl>=3.1,<4",
	"pypdf>=6.15,<7",
	"pymilvus[milvus-lite]>=2.6,<3",
	"fastembed>=0.7,<1",
	"python-docx>=1.2,<2",
]

[project.optional-dependencies]
dev = [
	"bandit[toml]>=1.8,<2",
	"pip-audit>=2.8,<3",
	"pre-commit>=4.1,<5",
	"pyright>=1.1.396,<2",
	"pytest>=9.0.3,<10",
	"pytest-asyncio>=0.25,<2",
	"pytest-cov>=6.0,<8",
	"ruff>=0.9,<1",
]

[tool.hatch.build]
exclude = ["/src/olympus_copilot_sdk/03_azure_databricks/**"]

[tool.hatch.build.targets.sdist]
exclude = ["/src/olympus_copilot_sdk/03_azure_databricks/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/olympus_copilot_sdk"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["src", "tests"]
exclude = ["src/olympus_copilot_sdk/03_azure_databricks"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=src --cov-report=term-missing"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.bandit]
recursive = true
targets = ["src", "app.py", "run_app.py"]
exclude_dirs = ["src/olympus_copilot_sdk/03_azure_databricks"]

[tool.coverage.run]
branch = true
source = ["src"]

# Use a lockfile in CI (for example, `uv lock`) and run `uv run pip-audit`.
[tool.uv]
default-groups = []
required-version = ">=0.6"