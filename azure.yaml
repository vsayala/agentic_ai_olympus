# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: olympus-zeus
requiredVersions:
  extensions:
    azure.ai.agents: ">=1.0.0-beta.4"
services:
  ai-project:
    host: azure.ai.project
  olympus-zeus:
    host: azure.ai.agent
    project: .
    language: python
    codeConfiguration:
      runtime: python_3_13
      entryPoint: src/olympus_copilot_sdk/foundry/main.py
    uses:
      - ai-project
    kind: hosted
    name: olympus-zeus
    description: Governed Olympus Zeus retrieval orchestrator.
    protocols:
      - protocol: responses
        version: 2.0.0
    environmentVariables:
      - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
        value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      - name: AZURE_AI_SEARCH_ENDPOINT
        value: ${AZURE_AI_SEARCH_ENDPOINT}
      - name: AZURE_AI_SEARCH_INDEXES
        value: ${AZURE_AI_SEARCH_INDEXES}
      - name: OLYMPUS_DEFAULT_ROUTE
        value: ${OLYMPUS_DEFAULT_ROUTE}
      - name: OLYMPUS_DEPENDENCY_PROVIDER
        value: ${OLYMPUS_DEPENDENCY_PROVIDER}
    container:
      resources:
        cpu: "0.5"
        memory: 1Gi
infra:
  provider: microsoft.foundry