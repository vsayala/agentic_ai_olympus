name: meltwater
kind: api
catalog: data
schema: meltwater
raw_volume: raw
checkpoint_volume: checkpoints
semantic_table: semantic_chunks
vector_index: data.meltwater.semantic_index
serving_endpoint: meltwater-hercules
options:
  base_url: https://REPLACE_ME.example
  api_path: /v1/REPLACE_ME
  secret_scope: REPLACE_ME_meltwater
  secret_key: api_token
  records_field: data
  cursor_field: next_cursor
  primary_key: event_id
  sync_mode: TRIGGERED