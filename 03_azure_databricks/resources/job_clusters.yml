variables:
  batch_job_cluster:
    description: Reusable classic compute template for non-AI Spark transformations.
    type: complex
    default:
      spark_version: 17.3.x-scala2.13
      node_type_id: Standard_D4ds_v5
      autoscale:
        min_workers: 1
        max_workers: 4
      data_security_mode: DATA_SECURITY_MODE_STANDARD
      runtime_engine: PHOTON
      azure_attributes:
        availability: SPOT_WITH_FALLBACK_AZURE
        first_on_demand: 1
        spot_bid_max_price: -1
      custom_tags:
        managed_by: databricks-bundle