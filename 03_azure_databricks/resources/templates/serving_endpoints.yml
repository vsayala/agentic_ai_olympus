# Move this file to resources/serving_endpoints.yml after each model version is promoted.
resources:
  model_serving_endpoints:
    sharepoint_agent:
      name: ${bundle.target}-sharepoint-hercules
      description: SharePoint evidence agent for Hercules.
      config:
        served_entities:
          - entity_name: ${var.catalog}.sharepoint.hercules_agent
            entity_version: ${var.agent_model_version}
            workload_size: Small
            scale_to_zero_enabled: true
      permissions:
        - level: CAN_QUERY
          service_principal_name: ${var.run_as_service_principal}
    policy_mogul_agent:
      name: ${bundle.target}-policy-mogul-hercules
      description: Governed Policy Mogul MCP agent for Hercules.
      config:
        served_entities:
          - entity_name: ${var.catalog}.policy_mogul.hercules_agent
            entity_version: ${var.agent_model_version}
            workload_size: Small
            scale_to_zero_enabled: true
      permissions:
        - level: CAN_QUERY
          service_principal_name: ${var.run_as_service_principal}