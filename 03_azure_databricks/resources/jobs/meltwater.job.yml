resources:
  jobs:
    meltwater_pipeline:
      name: ${bundle.target}-meltwater-medallion-pipeline
      description: Ingest API payloads and build bronze, silver, gold, and optional semantic assets.
      max_concurrent_runs: 1
      timeout_seconds: 14400
      job_clusters:
        - job_cluster_key: batch
          new_cluster: ${var.batch_job_cluster}
      tasks:
        - task_key: land_raw_payloads
          notebook_task:
            notebook_path: ../../notebooks/02_meltwater/01_land_raw_payloads.py
            base_parameters:
              config_path: ${workspace.file_path}/configs/meltwater.yml
          job_cluster_key: batch
          libraries:
            - whl: ../../dist/*.whl
          max_retries: 2
          min_retry_interval_millis: 60000
        - task_key: bronze
          depends_on:
            - task_key: land_raw_payloads
          notebook_task:
            notebook_path: ../../notebooks/02_meltwater/02_bronze.py
            base_parameters:
              config_path: ${workspace.file_path}/configs/meltwater.yml
          job_cluster_key: batch
          libraries:
            - whl: ../../dist/*.whl
          max_retries: 2
          min_retry_interval_millis: 60000
        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ../../notebooks/02_meltwater/03_silver.py
            base_parameters:
              config_path: ${workspace.file_path}/configs/meltwater.yml
          job_cluster_key: batch
          libraries:
            - whl: ../../dist/*.whl
        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ../../notebooks/02_meltwater/04_gold.py
            base_parameters:
              config_path: ${workspace.file_path}/configs/meltwater.yml
          job_cluster_key: batch
          libraries:
            - whl: ../../dist/*.whl
        - task_key: create_lookup_function
          depends_on:
            - task_key: gold
          notebook_task:
            notebook_path: ../../notebooks/02_meltwater/05_create_function.py
            base_parameters:
              config_path: ${workspace.file_path}/configs/meltwater.yml
          job_cluster_key: batch
          libraries:
            - whl: ../../dist/*.whl
        - task_key: validate_genie
          depends_on:
            - task_key: create_lookup_function
          notebook_task:
            notebook_path: ../../notebooks/02_meltwater/06_validate_genie.py
            base_parameters:
              genie_space_id: ${var.meltwater_genie_space_id}
          environment_key: serverless
      environments:
        - environment_key: serverless
          spec:
            environment_version: "3"
            dependencies:
              - ../../dist/*.whl
      tags:
        source: meltwater
        layer: medallion