resources:
  jobs:
    policy_mogul_mcp_validation:
      name: ${bundle.target}-policy-mogul-mcp-validation
      description: Validate the governed MCP connection without materializing source data.
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: UTC
        pause_status: PAUSED
      tasks:
        - task_key: validate_mcp
          notebook_task:
            notebook_path: ../../notebooks/validate_mcp.py
            base_parameters:
              config_path: ${workspace.file_path}/configs/policy_mogul.yml
              mcp_url: ${var.policy_mogul_mcp_url}
          environment_key: serverless
      environments:
        - environment_key: serverless
          spec:
            environment_version: "3"
            dependencies:
              - ../../dist/*.whl
      tags:
        source: policy_mogul
        integration: mcp