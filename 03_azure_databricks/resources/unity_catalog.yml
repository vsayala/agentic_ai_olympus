resources:
  catalogs:
    data:
      name: ${var.catalog}
      comment: Governed source data and AI assets for Olympus.
      lifecycle:
        prevent_destroy: true
  schemas:
    sharepoint:
      name: sharepoint
      catalog_name: ${resources.catalogs.data.name}
      comment: SharePoint documents, semantic chunks, functions, indexes, and models.
    meltwater:
      name: meltwater
      catalog_name: ${resources.catalogs.data.name}
      comment: Meltwater medallion tables, Genie assets, and narrative search indexes.
    policy_mogul:
      name: policy_mogul
      catalog_name: ${resources.catalogs.data.name}
      comment: Policy Mogul MCP audit metadata and source-agent assets.
  volumes:
    sharepoint_raw:
      catalog_name: ${resources.catalogs.data.name}
      schema_name: ${resources.schemas.sharepoint.name}
      name: raw
      volume_type: MANAGED
    sharepoint_checkpoints:
      catalog_name: ${resources.catalogs.data.name}
      schema_name: ${resources.schemas.sharepoint.name}
      name: checkpoints
      volume_type: MANAGED
    meltwater_raw:
      catalog_name: ${resources.catalogs.data.name}
      schema_name: ${resources.schemas.meltwater.name}
      name: raw
      volume_type: MANAGED
    meltwater_checkpoints:
      catalog_name: ${resources.catalogs.data.name}
      schema_name: ${resources.schemas.meltwater.name}
      name: checkpoints
      volume_type: MANAGED
    policy_mogul_raw:
      catalog_name: ${resources.catalogs.data.name}
      schema_name: ${resources.schemas.policy_mogul.name}
      name: raw
      volume_type: MANAGED
    policy_mogul_checkpoints:
      catalog_name: ${resources.catalogs.data.name}
      schema_name: ${resources.schemas.policy_mogul.name}
      name: checkpoints
      volume_type: MANAGED
  registered_models:
    sharepoint_agent:
      name: hercules_agent
      catalog_name: ${resources.catalogs.data.name}
      schema_name: ${resources.schemas.sharepoint.name}
      comment: Source agent backed by the SharePoint AI Search index.
    meltwater_agent:
      name: hercules_agent
      catalog_name: ${resources.catalogs.data.name}
      schema_name: ${resources.schemas.meltwater.name}
      comment: Source agent backed by Genie and narrative AI Search.
    policy_mogul_agent:
      name: hercules_agent
      catalog_name: ${resources.catalogs.data.name}
      schema_name: ${resources.schemas.policy_mogul.name}
      comment: Source agent backed by the governed Policy Mogul MCP server.